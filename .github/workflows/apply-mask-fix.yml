name: Apply inactive-bin plotting fix

on:
  push:
    branches:
      - fix/mask-inactive-weight-bins

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mask-inactive-weight-bins
      - name: Patch Streamlit mizer normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/hpc_viewer/streamlit_app.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for c in ["t", "w", "x", "N", "log_N", "log10_N"]:
              out[c] = pd.to_numeric(out[c], errors="coerce")

              # Weight support: only positive physical weights can be converted to x=log(w).
'''
          new = '''    for c in ["t", "w", "x", "N", "log_N", "log10_N"]:
              out[c] = pd.to_numeric(out[c], errors="coerce")

              # Structural zero abundance marks an inactive/masked size bin. Remove all
              # abundance representations so it cannot appear as log10(N)=0 in any plot.
              nonpositive_N = out["N"].notna() & (out["N"] <= 0)
              out.loc[nonpositive_N, ["N", "log_N", "log10_N"]] = np.nan

              # Weight support: only positive physical weights can be converted to x=log(w).
'''
          if old not in text:
              raise SystemExit('Expected normalization block not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-mask-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/hpc_viewer/streamlit_app.py .github/workflows/apply-mask-fix.yml
          git commit -m "Hide inactive mizer weight bins in app plots"
          git push origin HEAD:fix/mask-inactive-weight-bins
