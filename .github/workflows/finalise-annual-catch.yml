name: Finalise annual catch cleanup
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/annual-catch-observation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove obsolete quadrature path
        run: |
          python - <<'PY'
          from pathlib import Path
          train = Path('PINNmizer/training/train_pde_multispecies.py')
          s = train.read_text()
          s = s.replace('    parser.add_argument("--data-time-quadrature-points", type=int, default=1)\n', '')
          s = s.replace('def save_data_predictions_final(*, run_dir: Path, model: nn.Module, params, observation_batch: dict[str, object], eps: float, data_time_quadrature_points: int) -> None:\n', 'def save_data_predictions_final(*, run_dir: Path, model: nn.Module, params, observation_batch: dict[str, object], eps: float) -> None:\n')
          s = s.replace('    if data_time_quadrature_points > 1:\n        obs_times = torch.cat([obs_times, torch.cat([torch.linspace(a, b, data_time_quadrature_points, dtype=obs_times.dtype, device=obs_times.device) for a, b in zip(observation_batch["t_start"], observation_batch["t_end"])])])\n', '')
          s = s.replace('        "data_time_quadrature_points": args.data_time_quadrature_points,\n', '')
          s = s.replace('                data_time_quadrature_points=args.data_time_quadrature_points,\n', '')
          train.write_text(s)
          loop = Path('PINNmizer/training/loop_multispecies.py')
          s = loop.read_text()
          s = s.replace('    data_time_quadrature_points: int = 1,\n', '')
          s = s.replace('            if data_time_quadrature_points > 1:\n                qs = []\n                for a, b in zip(observation_batch["t_start"], observation_batch["t_end"]):\n                    qs.append(torch.linspace(a, b, data_time_quadrature_points, dtype=obs_times.dtype, device=obs_times.device))\n                obs_times = torch.cat([obs_times, torch.cat(qs)])\n\n', '')
          loop.write_text(s)
          for path in Path('.').rglob('*'):
              if path.is_file() and path.suffix in {'.py', '.sh', '.md'} and '.git' not in path.parts:
                  text = path.read_text(errors='ignore')
                  if 'data-time-quadrature-points' in text:
                      path.write_text('\n'.join(line for line in text.splitlines() if 'data-time-quadrature-points' not in line) + '\n')
          assert 'data_time_quadrature_points' not in train.read_text()
          assert 'data_time_quadrature_points' not in loop.read_text()
          PY
      - name: Validate source and observation operator
        run: |
          python -m compileall -q PINNmizer validation/scripts/checks/validate_data_likelihood_smoke.py
          python -m pip install --quiet pandas numpy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python validation/scripts/checks/validate_data_likelihood_smoke.py
          ! git grep -n 'data.time.quadrature.points\|data_time_quadrature_points' -- ':!runs'
      - name: Commit validated cleanup
        run: |
          rm .github/workflows/finalise-annual-catch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalise annual catch observation operator cleanup'
          git push origin HEAD:fix/annual-catch-observation
