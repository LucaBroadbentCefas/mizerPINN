# trigger main workflow
name: Finalise annual catch cleanup
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/annual-catch-observation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Placeholder
        run: echo "Base-branch workflow performs cleanup"
