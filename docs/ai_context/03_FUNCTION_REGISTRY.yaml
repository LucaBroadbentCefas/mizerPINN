# Function registry for the PINNmizer project.
# This is deliberately selective: it records functions that matter for project continuity.

modules:
  PINNmizer.params:
    file: PINNmizer/params.py
    role: Parameter container, shape helpers, dtype/device helpers, coordinate scaling, active masks, and optional fixture timestep storage.
    functions:
      MizerTorchParams:
        kind: dataclass
        purpose: Holds grids, FFT reference arrays, continuous biological parameters, interaction matrices, reproduction parameters, mortality parameters, time bounds, active-size vectors, and optional fixture timestep.
        status: active
      dt:
        kind: dataclass_field
        purpose: Optional physical timestep loaded from fixture/export `dt.csv` and used by timestep-consistency loss when no explicit `timestep_dt` is supplied.
        shape: scalar tensor or None
        status: active
      fish_start:
        purpose: Return index where fish grid starts within full resource+fish grid.
        returns: int
        status: active
      scale_x:
        purpose: Convert physical log-weight x to scaled x coordinate.
        inputs: [x, params]
        status: active
      scale_t:
        purpose: Convert physical time t to scaled t coordinate.
        inputs: [t, params]
        status: active
      active_grid_mask:
        purpose: Return species-by-grid mask for active fish-grid weights below or equal to species `w_max`.
        returns: '[n_species, n_w]'
        status: active
      active_eval_mask:
        purpose: Return species-by-evaluation mask for active off-grid weights below or equal to species `w_max`.
        returns: '[n_species, n_eval] or [n_species, n_pair] depending on input length'
        status: active
      validate_params_shapes:
        purpose: Assert expected shapes for core parameters.
        status: active_but_marked_remove_later_in_source

  PINNmizer.io:
    file: PINNmizer/io.py
    role: Load R/mizer/TMB CSV exports into tensors.
    functions:
      load_mizer_inputs:
        purpose: Load exported inputs and construct MizerTorchParams, n_init, and n_pp.
        returns: [params, n_init, n_pp]
        notes:
          - Optionally loads `dt.csv` into `params.dt`.
          - `params.dt` should represent the mizer timestep used by the fixture/export.
          - CLI `--timestep-dt` is an explicit experimental override of fixture `params.dt`.
        status: active
      load_complex_mat:
        purpose: Load real/imag CSV pairs as complex tensors.
        status: active
      maybe_vec:
        purpose: Load an optional vector CSV if present, otherwise return None.
        status: active_internal
      maybe_mat:
        purpose: Load an optional matrix CSV if present, otherwise return None.
        status: active_internal

  PINNmizer.mizer_grid_ops:
    file: PINNmizer/mizer_grid_ops.py
    role: Fixed-grid FFT-style mizer/TMB operator path for validation/reference and timestep projection.
    functions:
      compute_prey:
        purpose: Build prey spectrum over full grid with resource and fish prey contributions.
        inputs:
          n_pp: '[k_full]'
          n: '[n_species, n_w]'
        returns: '[n_species, k_full]'
        status: active
      get_encounter:
        purpose: FFT-based encounter calculation on fixed fish grid.
        returns: '[n_species, n_w]'
        status: validation_reference
      feeding_level:
        purpose: Compute encounter / (encounter + intake_max + eps).
        status: active
      e_repro_and_growth:
        purpose: Compute available energy for reproduction and growth before positive-part and allocation split.
        formula: '(1 - feeding) * encounter * alpha - metab'
        status: active
      mizer_operators:
        purpose: Compute fixed-grid operator dictionary.
        status: validation_reference
      step:
        purpose: One AD-safe fixed-grid projection step used by validation/reference workflows and by optional timestep-consistency loss.
        status: validation_reference_and_timestep_loss_target

  PINNmizer.biology.kernels:
    file: PINNmizer/biology/kernels.py
    role: Continuous/off-grid predation kernel and derivative terms.
    status: active

  PINNmizer.biology.encounter:
    file: PINNmizer/biology/encounter.py
    role: Continuous/off-grid encounter/search terms at arbitrary physical weights.
    status: active

  PINNmizer.biology.growth:
    file: PINNmizer/biology/growth.py
    role: Continuous/off-grid intake, metabolism, reproduction allocation, growth, and manual dg_dw.
    status: active

  PINNmizer.biology.mortality:
    file: PINNmizer/biology/mortality.py
    role: Continuous/off-grid background and predation mortality.
    status: active

  PINNmizer.biology.recruitment:
    file: PINNmizer/biology/recruitment.py
    role: Continuous/off-grid recruitment boundary flux from predicted grid spectrum.
    status: active

  PINNmizer.pinn.sampling:
    file: PINNmizer/pinn/sampling.py
    role: Current Cartesian PDE collocation batch sampling and scaled/physical coordinate construction.
    functions:
      sample_pde_batch:
        purpose: Sample random continuous time and log-weight collocation vectors for the original Cartesian PDE path.
        supports:
          - optional t_max_current for old causal curriculum
        returns:
          t_eval: '[n_time]'
          t_scaled: '[n_time]'
          x_eval: '[n_eval]'
          x_eval_scaled: '[n_eval]'
          w_eval: '[n_eval]'
          x_grid_scaled: '[n_w]'
        residual_shape_downstream: '[n_time, n_species, n_eval]'
        status: active

  PINNmizer.pinn.r3:
    file: PINNmizer/pinn/r3.py
    role: Planned minimal R3 and Causal R3 paired-collocation population, scoring, retain/resample, and causal-gate utilities.
    status: planned_implementation_target
    functions:
      R3Population:
        kind: dataclass
        purpose: Store persistent paired collocation points with physical columns [x, t] and optional random generator.
        shape:
          points: '[n_pair, 2]'
        status: planned
      CausalR3:
        kind: dataclass
        purpose: Store causal gate state and update gamma from detached PDE loss.
        formula: 'G(t; alpha, gamma) = (1 - tanh(alpha * (t_scaled - gamma))) / 2'
        status: planned
      make_r3_population:
        purpose: Initialise paired R3 collocation population over physical x/t domain, optionally bounded by species w_max.
        returns: R3Population
        status: planned
      update_r3_population_:
        purpose: Score paired residuals, retain points above mean score, resample released points, mutate population in place, and return minimal diagnostics.
        status: planned

  PINNmizer.pinn.model_eval:
    file: PINNmizer/pinn/model_eval.py
    role: Model input construction and grid/eval-point model calls.
    functions:
      _make_model_inputs:
        purpose: Build time-major Cartesian model inputs with columns [x_scaled, t_scaled].
        returns: '[n_time * n_x, 2]'
        status: active_internal
      evaluate_log_model_on_points:
        purpose: Evaluate model on Cartesian product of x and t values.
        returns:
          log_N: '[n_time, n_species, n_x]'
          N: '[n_time, n_species, n_x]'
        status: active

  PINNmizer.pinn.derivatives:
    file: PINNmizer/pinn/derivatives.py
    role: Autograd derivatives of model output with respect to scaled coordinates and conversion to physical derivatives.
    functions:
      evaluate_log_model_with_derivatives_at_eval:
        purpose: Evaluate model and compute dlogN/dt, dlogN/dw, dN/dt, dN/dw at Cartesian collocation points.
        derivative_source: autograd_through_model
        returns_shape: '[n_time, n_species, n_eval]'
        status: active
      evaluate_log_model_with_derivatives_at_pairs:
        purpose: Planned paired R3 derivative evaluator for inputs `(x_pair_scaled[j], t_pair_scaled[j])` without Cartesian expansion.
        derivative_source: autograd_through_model
        returns_shape: '[n_species, n_pair]'
        status: planned_for_r3

  PINNmizer.pinn.pde_state:
    file: PINNmizer/pinn/pde_state.py
    role: Cached model, biological, mortality, recruitment, and optional IC state for PDE losses.
    functions:
      compute_pde_state:
        purpose: Evaluate Cartesian model outputs, biological terms, mortality, and recruitment once per sampled time batch.
        residual_shape_downstream: '[n_time, n_species, n_eval]'
        status: active
      compute_pde_state_paired:
        purpose: Planned paired R3 PDE state; evaluates model/grid biology for each paired time and residual biology at the paired weight.
        residual_shape_downstream: '[n_species, n_pair]'
        grid_shape: '[n_pair, n_species, n_w]'
        status: planned_for_r3

  PINNmizer.pinn.residual:
    file: PINNmizer/pinn/residual.py
    role: Continuous/off-grid PDE residual assembly.
    functions:
      compute_pde_residual_from_state:
        purpose: Assemble log and physical/check residuals from cached state; should remain reusable for Cartesian and paired state if tensor shapes are compatible.
        status: active
      compute_pde_residual:
        purpose: Convenience wrapper for PDE residual only.
        status: active

  PINNmizer.pinn.losses:
    file: PINNmizer/pinn/losses.py
    role: Continuous/off-grid PDE loss plus initial-condition and recruitment-boundary losses.
    functions:
      compute_initial_condition_loss_from_state:
        purpose: Compute log initial-condition loss using cached t_min model output and active grid mask.
        status: active
      compute_recruitment_boundary_loss_from_state:
        purpose: Compute recruitment boundary flux loss at species-specific egg index.
        loss_forms: [physical, log, relative]
        diagnostics:
          - flux_left_min
          - recruitment_flux_min
          - frac_flux_left_clamped
          - frac_recruitment_flux_clamped
          - boundary_residual_abs_p95
        status: active
      compute_pde_loss:
        purpose: Assemble PDE, IC, and BC loss components and return diagnostics for Cartesian collocation batches.
        residual_shape: '[n_time, n_species, n_eval]'
        status: active
      compute_pde_loss_paired:
        purpose: Planned paired R3 PDE/IC/BC loss function using residual shape `[n_species, n_pair]`, active_eval_mask on `w_pair`, and optional causal PDE sample weights.
        residual_shape: '[n_species, n_pair]'
        status: planned_for_r3

  PINNmizer.pinn.timestep_consistency:
    file: PINNmizer/pinn/timestep_consistency.py
    role: Fixed-grid timestep-consistency loss for temporal regularisation and diagnostics.
    functions:
      compute_timestep_consistency_loss:
        purpose: Compare model prediction at `t + dt` against `mizer_grid_ops.step(...)` applied to model prediction at `t`.
        inputs:
          model: neural network mapping [x_scaled, t_scaled] to log_N
          params: MizerTorchParams
          n_pp: '[k_full]'
          t0: scalar or '[n_pairs]' physical time tensor
          dt: scalar tensor, float, or None
        outputs:
          loss_timestep: scalar tensor
          diagnostics:
            - residual_timestep_physical
            - residual_timestep_log
            - residual_timestep_relative
            - N0_pred
            - N1_pred
            - N1_step
            - n_pp_step
            - physical_abs_mean
            - physical_abs_max
            - log_abs_mean
            - log_abs_max
            - relative_abs_mean
            - relative_abs_max
        residual_forms: [physical, log, relative]
        default_detach_step_target: true
        shape_convention:
          N0_pred: '[n_pairs, n_species_or_1, n_w]'
          N1_pred: '[n_pairs, n_species_or_1, n_w]'
          N1_step: '[n_pairs, n_species_or_1, n_w]'
        status: active_opt_in_training_loss

  PINNmizer.training.loop:
    file: PINNmizer/training/loop.py
    role: Per-step training logic.
    functions:
      train_one_step:
        purpose: Perform one sampled training step with optional adaptive weighting and diagnostics row output.
        timestep_loss:
          active_when: lambda_timestep > 0
          weighted_by: lambda_timestep * loss_weights["timestep"] unless Wang weights are disabled
          parameters:
            - lambda_timestep
            - timestep_loss_form
            - detach_step_target
            - timestep_dt
            - timestep_n_pairs
          diagnostics:
            - loss_timestep
            - lambda_timestep
            - w_timestep
            - weighted_loss_timestep
            - grad_timestep_mean_for_weighting
            - target_w_timestep
            - timestep_physical_abs_mean
            - timestep_physical_abs_max
            - timestep_log_abs_mean
            - timestep_log_abs_max
            - timestep_relative_abs_mean
            - timestep_relative_abs_max
        r3_collocation:
          status: planned
          intended_parameters:
            - collocation_strategy
            - r3_population
            - r3_update_every
            - r3_warmup_steps
            - r3_score_form
            - causal_r3
            - causal_r3_weight_pde_loss
            - causal_r3_score
          diagnostics:
            - collocation_strategy
            - r3_population_size
            - r3_retained_fraction
            - r3_resampled
            - r3_score_mean
            - r3_score_max
            - causal_r3_gamma
            - causal_r3_gamma_update
            - causal_r3_gate_mean
        known_risk:
          - valid timestep-pair filtering can make t0 empty before compute_timestep_consistency_loss() if all sampled t0 + dt exceed t_max.
          - paired R3 can be much more expensive than Cartesian sampling because nonlocal biology may be evaluated for many unique pair times.
        status: active_with_planned_r3_branch

  PINNmizer.training.weighting:
    file: PINNmizer/training/weighting.py
    role: Wang-style gradient-statistics weighting.
    functions:
      update_wang_gradient_weights_:
        purpose: Update arbitrary non-PDE loss weights using PDE max gradient as anchor.
        anchor: PDE weight fixed at 1.0
        formula: target_weight = max_abs_grad(loss_pde) / mean_abs_grad(loss_component)
        postprocessing:
          - clip target to [weight_min, weight_max]
          - hard-set or exponentially smooth depending on configuration
        supports_loss_keys:
          - ic
          - bc
          - timestep
          - future non-PDE scalar losses
        status: active

  PINNmizer.training.train_pde_only_single_species:
    file: PINNmizer/training/train_pde_only_single_species.py
    role: Package-level single-species training workflow and CLI argument parsing.
    functions:
      MLP:
        kind: imported nn.Module
        source: PINNmizer.pinn.models.MLP
        purpose: Simple fully-connected tanh network mapping [x_scaled, t_scaled] to species log_N.
        status: active
      initialise_final_bias_from_ic:
        purpose: Set final-layer bias to mean initial log abundance per species.
        status: active
      parse_args:
        purpose: Expose training CLI/config including timestep-consistency options and planned R3 collocation options.
        timestep_cli_args:
          - --initial-w-timestep
          - --lambda-timestep
          - --timestep-loss-form {physical,log,relative}
          - --detach-step-target
          - --no-detach-step-target
          - --timestep-dt
          - --timestep-n-pairs
        timestep_defaults:
          lambda_timestep: 0.0
          initial_w_timestep: 1.0
          timestep_loss_form: physical
          detach_step_target: true
          timestep_dt: null
          timestep_n_pairs: 1
        planned_r3_cli_args:
          - --collocation-strategy {uniform,r3,causal-r3}
          - --r3-population-size
          - --r3-update-every
          - --r3-warmup-steps
          - --r3-score-form {abs,squared}
          - --r3-seed
          - --causal-r3-alpha
          - --causal-r3-gamma-init
          - --causal-r3-gamma-max
          - --causal-r3-weight-pde-loss
          - --no-causal-r3-score
        planned_r3_guard:
          - require --causal-curriculum off when collocation_strategy is r3 or causal-r3 unless a future ADR explicitly allows stacking
        status: active_with_planned_r3_cli
      main:
        purpose: Full command-line training run.
        status: active

  PINNmizer.diagnostics.fixed_grid:
    file: PINNmizer/diagnostics/fixed_grid.py
    role: Deterministic fixed-grid diagnostics for package training workflows.
    functions:
      make_fixed_pde_batch:
        purpose: Build deterministic Cartesian diagnostic grid.
        status: active
      make_fixed_pde_batch_from_csv:
        purpose: Build deterministic diagnostic grid from CSV-specified physical t and x values.
        status: active
      compute_fixed_diagnostics:
        purpose: Compute fixed-grid losses, residual metrics, PDE term magnitudes, BC diagnostics, and gradient diagnostics.
        status: active

  PINNmizer.diagnostics.outputs:
    file: PINNmizer/diagnostics/outputs.py
    role: Diagnostic table/file outputs.
    status: active

  PINNmizer.diagnostics.plots:
    file: PINNmizer/diagnostics/plots.py
    role: Diagnostic plotting utilities.
    status: active_optional_plotting

  PINNmizer.diagnostics.fields:
    file: PINNmizer/diagnostics/fields.py
    role: Final fixed-grid fields and plots.
    status: active_optional_plotting

cross_cutting_invariants:
  - Preserve dtype/device consistency.
  - Preserve model input column order [x_scaled, t_scaled].
  - Preserve model output interpretation as log_N unless an explicit ADR changes it.
  - Preserve manual/analytical dg_dw path unless an explicit ADR changes it.
  - Treat the continuous/off-grid PDE residual path and fixed-grid mizer/TMB path as distinct.
  - Treat timestep consistency as a fixed-grid temporal regulariser distinct from the continuous PDE residual.
  - Treat R3 as paired collocation geometry, not as Cartesian x/t vector retention.
  - Preserve active-size masking with w_max in grid/eval losses and R3 scoring.
  - Do not silently stack Causal R3 with the old causal curriculum.
  - Generated validation outputs belong under validation/outputs/, not root-level py_* folders.
