# Function registry for the PINNmizer project.
# This is deliberately selective: it records functions that matter for project continuity.

modules:
  PINNmizer.params:
    file: PINNmizer/params.py
    role: Parameter container, shape helpers, dtype/device helpers, and coordinate scaling.
    functions:
      MizerTorchParams:
        kind: dataclass
        purpose: Holds grids, FFT reference arrays, continuous biological parameters, interaction matrices, reproduction parameters, mortality parameters, and time bounds.
        status: active
      fish_start:
        purpose: Return index where fish grid starts within full resource+fish grid.
        returns: int
        status: active
      scale_x:
        purpose: Convert physical log-weight x to scaled x coordinate.
        inputs: [x, params]
        status: active
      scale_t:
        purpose: Convert physical time t to scaled t coordinate.
        inputs: [t, params]
        status: active
      validate_params_shapes:
        purpose: Assert expected shapes for core parameters.
        status: active_but_marked_remove_later_in_source

  PINNmizer.io:
    file: PINNmizer/io.py
    role: Load R/mizer/TMB CSV exports into tensors.
    functions:
      load_mizer_inputs:
        purpose: Load exported inputs and construct MizerTorchParams, n_init, and n_pp.
        returns: [params, n_init, n_pp]
        status: active
      load_complex_mat:
        purpose: Load real/imag CSV pairs as complex tensors.
        status: active

  PINNmizer.mizer_grid_ops:
    file: PINNmizer/mizer_grid_ops.py
    role: Fixed-grid FFT-style mizer/TMB operator path for validation/reference.
    functions:
      compute_prey:
        purpose: Build prey spectrum over full grid with resource and fish prey contributions.
        inputs:
          n_pp: '[k_full]'
          n: '[n_species, n_w]'
        returns: '[n_species, k_full]'
        status: active
      get_encounter:
        purpose: FFT-based encounter calculation on fixed fish grid.
        returns: '[n_species, n_w]'
        status: validation_reference
      feeding_level:
        purpose: Compute encounter / (encounter + intake_max + eps).
        status: active
      e_repro_and_growth:
        purpose: Compute available energy for reproduction and growth before positive-part and allocation split.
        formula: '(1 - feeding) * encounter * alpha - metab'
        status: active
      mizer_operators:
        purpose: Compute fixed-grid operator dictionary.
        status: validation_reference
      step:
        purpose: One AD-safe projection step using fixed-grid operators.
        status: validation_or_simulation_reference

  PINNmizer.continuous_biology:
    file: PINNmizer/continuous_biology.py
    role: Continuous/off-grid biological path for PDE residual.
    functions:
      compute_encounter_direct_at_eval:
        purpose: Compute direct encounter and dencounter/dw at arbitrary predator weights.
        inputs:
          n_pp: '[k_full]'
          n_grid: '[n_species, n_w]'
          w_eval: '[n_eval]'
        returns:
          encounter_eval: '[n_species, n_eval]'
          dencounter_dw: '[n_species, n_eval]'
        status: active
      evaluate_gamma_continuous:
        purpose: Evaluate gamma_i(w) = gamma_i * w^q_i and derivative.
        returns:
          gamma_eval: '[n_species, n_eval]'
          dgamma_dw: '[n_species, n_eval]'
        status: active
      evaluate_intake_max_continuous:
        purpose: Evaluate h_i(w) = h_i * w^n_i and derivative.
        status: active
      evaluate_metab_continuous:
        purpose: Evaluate metab_i(w) = ks_i * w^p_i + k_i * w and derivative.
        status: active
      evaluate_psi_continuous:
        purpose: Evaluate reproduction allocation psi_i(w) and derivative, including immature and above-repro cutoffs.
        status: active
      compute_phi_and_dphi_dw:
        purpose: Evaluate log-normal predation kernel and derivative with respect to predator weight.
        returns:
          phi: '[n_species, n_pred, n_prey]'
          dphi_dw_pred: '[n_species, n_pred, n_prey]'
        status: active
      evaluate_mu_b_continuous:
        purpose: Evaluate constant or allometric background mortality.
        returns: '[n_species, n_eval]'
        status: active
      compute_growth_direct_at_eval:
        purpose: Compute continuous growth-side terms and manual dg/dw.
        important_outputs:
          - encounter_eval
          - feeding_eval
          - erepog_eval
          - e_repro_eval
          - e_growth_eval
          - dg_dw
        status: active
      compute_pred_mortality_direct_at_eval_from_growth_grid:
        purpose: Compute direct predation mortality using already-computed grid growth.
        status: active
      compute_total_mortality_direct_at_eval_from_growth_grid:
        purpose: Return mu_b_eval, pred_mort_eval, and total mu_eval.
        status: active
      compute_recruitment_direct_from_growth_grid:
        purpose: Compute reproductive integral and RDI/RDD recruitment flux from predicted grid spectrum.
        status: active

  PINNmizer.pde_residual:
    file: PINNmizer/pde_residual.py
    role: Model evaluation, derivative computation, PDE state cache, residual and loss assembly.
    functions:
      sample_pde_batch:
        purpose: Sample random continuous time and log-weight collocation vectors.
        supports:
          - optional t_max_current for causal curriculum
        returns:
          t_eval: '[n_time]'
          t_scaled: '[n_time]'
          x_eval: '[n_eval]'
          x_eval_scaled: '[n_eval]'
          w_eval: '[n_eval]'
          x_grid_scaled: '[n_w]'
        status: active
      _make_model_inputs:
        purpose: Build time-major model inputs with columns [x_scaled, t_scaled].
        returns: '[n_time * n_x, 2]'
        status: active_internal
      evaluate_log_model_on_points:
        purpose: Evaluate model on Cartesian product of x and t values.
        returns:
          log_N: '[n_time, n_species, n_x]'
          N: '[n_time, n_species, n_x]'
        status: active
      evaluate_log_model_with_derivatives_at_eval:
        purpose: Evaluate model and compute dlogN/dt, dlogN/dw, dN/dt, dN/dw at collocation points.
        derivative_source: autograd_through_model
        returns_shape: '[n_time, n_species, n_eval]'
        status: active
      compute_pde_state:
        purpose: Evaluate model, biological terms, mortality, and recruitment once per batch.
        status: active
      compute_pde_residual_from_state:
        purpose: Assemble log and physical/check residuals from cached state.
        status: active
      compute_pde_residual:
        purpose: Convenience wrapper for PDE residual only.
        status: active
      compute_initial_condition_loss_from_state:
        purpose: Compute log initial-condition loss using cached t_min model output.
        status: active
      compute_recruitment_boundary_loss_from_state:
        purpose: Compute recruitment boundary flux loss at species-specific egg index.
        loss_forms: [physical, log, relative]
        diagnostics:
          - flux_left_min
          - recruitment_flux_min
          - frac_flux_left_clamped
          - frac_recruitment_flux_clamped
          - boundary_residual_abs_p95
        status: active
      compute_pde_loss:
        purpose: Assemble weighted PDE, IC, and BC loss components and return diagnostics.
        status: active

  validation_steps.train_pde_only_single_species:
    file: validation_steps/train_pde_only_single_species.py
    role: Current single-species training executable.
    functions:
      MLP:
        kind: nn.Module
        purpose: Simple fully-connected tanh network mapping [x_scaled, t_scaled] to species log_N.
        status: active
      initialise_final_bias_from_ic:
        purpose: Set final-layer bias to mean initial log abundance per species.
        status: active
      causal_time_fraction:
        purpose: Compute time-domain fraction for causal curriculum.
        modes: [off, linear, step]
        status: active
      causal_t_max_current:
        purpose: Convert causal fraction to physical t_max_current.
        status: active
      train_one_step:
        purpose: Perform one sampled training step with optional adaptive weighting and diagnostics row output.
        status: active
      update_wang_gradient_weights_:
        purpose: Update PDE/IC/BC weights using Wang-style gradient statistics.
        anchor: PDE weight fixed at 1.0
        status: active_but_candidate_for_module_split
      save_final_predictions:
        purpose: Export final model predictions on a fixed grid.
        status: active
      save_final_residual_sample:
        purpose: Export final residual sample.
        status: active
      main:
        purpose: Full command-line training run.
        status: active

  validation_steps.pinn_diagnostics:
    file: validation_steps/pinn_diagnostics.py
    role: Deterministic fixed-grid diagnostics and plotting.
    functions:
      make_fixed_pde_batch:
        purpose: Build deterministic Cartesian diagnostic grid.
        status: active
      make_fixed_pde_batch_from_csv:
        purpose: Build deterministic diagnostic grid from CSV-specified physical t and x values.
        status: active
      compute_fixed_diagnostics:
        purpose: Compute fixed-grid losses, residual metrics, PDE term magnitudes, BC diagnostics, and gradient diagnostics.
        status: active
      append_diagnostic_row:
        purpose: Append one diagnostic row to CSV.
        status: active
      save_training_diagnostic_plots:
        purpose: Save standard diagnostic line plots from training and fixed diagnostic histories.
        status: active
      save_latest_metrics_table:
        purpose: Save latest metrics as CSV and PNG table.
        status: active
      save_fixed_grid_fields_and_plots:
        purpose: Save final fixed-grid fields and heatmaps.
        status: active

cross_cutting_invariants:
  - Preserve PyTorch-only differentiable loss path.
  - Preserve dtype/device consistency.
  - Preserve model input column order [x_scaled, t_scaled].
  - Preserve model output interpretation as log_N unless an explicit ADR changes it.
  - Preserve manual/analytical dg_dw path unless an explicit ADR changes it.
  - Treat fixed-grid FFT operators as validation/reference unless explicitly changing the PDE path.
